<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Desafio 13</title>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
        }

        table {
            border-collapse: collapse;
            width: 500px;
        }

        thead {
            background-color: gray;
            color: white;
        }

        th, td {
            border: 1px solid black;
            padding: 10px;
        }

        .media {
            background-color: gray;
            color: white;
            text-align: left;
            font-weight: bold;
        }

        .num {
            text-align: center;
        }
    </style>
</head>
<body>
    <table>
        <thead>
            <tr>
                <th rowspan="2" scope="colgroup">Área</th>
                <th rowspan="2" scope="colgroup">Disciplinas</th>
                <th colspan="2" scope="rowgroup">Notas</th>
                <th rowspan="2" scope="colgroup">Média</th>
            </tr>
            <tr>
                <th scope="colgroup">Nota 1</th>
                <th scope="colgroup">Nota 2</th>                
            </tr>
        </thead>
        <tbody>
            <tr>
                <th rowspan="4" scope="rowgroup">Exatas</th>
                <td>Matemática</td>
                <td class="num">7.4</td>
                <td class="num">8.0</td>
                <td class="num">7.7</td>
            </tr>
            <tr>
                <td>Física</td>
                <td class="num">8.5</td>
                <td class="num">8.3</td>
                <td class="num">8.4</td>
            </tr>
            <tr>
                <td>Química</td>
                <td class="num">6.4</td>
                <td class="num">7.4</td>
                <td class="num">6.9</td>
            </tr>
            <tr>
                <td>Biologia</td>
                <td class="num">8.5</td>
                <td class="num">7.8</td>
                <td class="num">8.2</td>
            </tr>
            <tr class="media">
                <th colspan="4" scope="row">Média de Exatas</th>
                <td class="num">8.6</td>
            </tr>
            <tr>
                <th rowspan="2" scope="rowgroup">Humanas</th>
                <td>História</td>
                <td class="num">7.3</td>
                <td class="num">7.9</td>
                <td class="num">7.6</td>
            </tr>
            <tr>
                <td>Geografia</td>
                <td class="num">8.4</td>
                <td class="num">8.2</td>
                <td class="num">8.3</td>
            </tr>
            <tr class="media">
                <th colspan="4" scope="row">Média de Humanas</th>
                <td class="num">8.0</td>
            </tr>
        </tbody>
    </table>
</body>
</html>
